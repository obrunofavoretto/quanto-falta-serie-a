name: Publicar Quanto Falta
on:
  workflow_dispatch:
  workflow_run:
    workflows: ['Atualizar dados da liga']
    types: [completed]
  push:
    branches: [main]
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  publish:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar dados e ferramentas
        run: |
          python -m unittest discover -s tests -v
          node tests/test_goal_clock.js
          node tests/test_reactions.js
          node tests/test_periods.js
      - uses: actions/configure-pages@v5
      - run: |
          mkdir public
          cp *.html *.css *.js *.json .nojekyll public/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deployment
        uses: actions/deploy-pages@v4
